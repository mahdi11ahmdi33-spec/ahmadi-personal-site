<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061426">
<meta name="description" content="وب‌سایت شخصی مهدی احمدی">
<title>مهدی احمدی | برند شخصی</title>
<style>
:root{--bg:#061426;--bg2:#020914;--panel:rgba(14,39,65,.84);--line:rgba(164,204,255,.18);--text:#f4f8ff;--muted:#a9bfd8;--cyan:#72dcff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(#061426,#020914);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif}
body.light{--bg:#eaf3ff;--bg2:#d8e8fb;--panel:rgba(255,255,255,.92);--line:#1e4b8233;--text:#10233c;--muted:#526b89;background:linear-gradient(var(--bg),var(--bg2))}
button,input,textarea{font:inherit}
button{cursor:pointer}
.wallpaper{position:fixed;inset:0;z-index:-1;background:linear-gradient(#03101c99,#020914f2),url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=80') center/cover}
.app{width:min(100%,650px);margin:auto;min-height:100vh;padding:0 16px 110px}
.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:1px;font-weight:bold;direction:ltr}
.logo{width:40px;height:40px;border:1px solid #8fbaff88;border-radius:14px;display:grid;place-items:center;color:var(--cyan);font-size:20px;background:#a9d8ff12}
.top-actions{display:flex;gap:8px}
.glass-btn{border:1px solid var(--line);background:#b4d8ff12;color:var(--text);border-radius:14px;width:42px;height:42px;font-size:21px}
.page{display:none;animation:appear .3s ease}
.page.active{display:block}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.hero{text-align:center;padding:26px 8px 18px}
.avatar-wrap{width:132px;height:132px;margin:0 auto 18px}
.avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #8cc5ff;box-shadow:0 0 0 7px #5d9fff18,0 0 38px #357aff80;background:#102a45}
.eyebrow{font-size:11px;letter-spacing:3px;color:var(--cyan);direction:ltr}
.hero h1{font-size:clamp(27px,7vw,39px);margin:12px 0 8px;direction:ltr}
.subtitle{font-size:14px;line-height:2;margin:0 auto;max-width:350px}
.bio-small{color:var(--muted);font-size:12px;line-height:2;margin:8px auto 18px;max-width:340px}
.primary{display:inline-flex;align-items:center;justify-content:center;border:1px solid #7caaff99;border-radius:999px;padding:12px 22px;color:white;text-decoration:none;background:linear-gradient(120deg,#234c8c,#536bca)}
.glass{border:1px solid var(--line);background:linear-gradient(145deg,var(--panel),rgba(5,20,36,.8));backdrop-filter:blur(18px);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 14px 38px #0002}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 14px}
.section-head h2,.page-title{font-size:21px;margin:0}
.section-head span{font-size:11px;color:var(--cyan)}
.social-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:14px 0 20px}
.social{min-width:0;text-decoration:none;color:var(--text);border:1px solid var(--line);background:linear-gradient(145deg,#142d49e8,#081a2ce8);border-radius:20px;padding:13px 3px;text-align:center}
.social-icon{display:grid;place-items:center;margin:0 auto 9px;width:42px;height:42px;border-radius:50%;background:#233c67;font-size:21px;font-weight:bold}
.social span:last-child{font-size:10px;display:block;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stat strong{display:block;font-size:21px;direction:ltr}
.stat span{font-size:11px;color:var(--muted);display:block;margin-top:6px}
.tile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{padding:16px 7px;border-radius:18px;border:1px solid var(--line);background:#b5d8ff0a;text-align:center;color:var(--text)}
.tile b{font-size:24px;display:block;margin-bottom:10px}
.tile span{font-size:11px;color:var(--muted)}
.page-intro{color:var(--muted);line-height:2;font-size:13px;margin:10px 0 18px}
.info-row{display:flex;gap:13px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.info-row:last-child{border:0}
.info-ico{width:43px;height:43px;display:grid;place-items:center;border-radius:15px;background:#527dff22;font-size:20px;flex-shrink:0}
.info-row strong{font-size:13px;display:block;margin-bottom:5px}
.info-row small{font-size:11px;color:var(--muted)}
.project-cover{height:120px;background:linear-gradient(135deg,#1d4a7b,#111d43);display:grid;place-items:center;font-size:42px;border-radius:18px}
.project p{color:var(--muted);font-size:12px;line-height:2}
.searchbox,.field{width:100%;padding:14px;border:1px solid var(--line);border-radius:15px;background:#081b30;color:white;outline:none;margin:8px 0 14px}
.empty{color:var(--muted);font-size:12px;padding:15px;text-align:center}
.bottom-nav{position:fixed;z-index:5;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 22px),620px);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px;border-radius:25px;border:1px solid #b3d6ff30;background:#07182bf2;box-shadow:0 12px 40px #0008;backdrop-filter:blur(22px)}
.nav-item{border:0;background:transparent;color:#91a9c5;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:17px;font-size:10px}
.nav-icon{font-size:20px}
.nav-item.active{background:linear-gradient(140deg,#3e6eff66,#3ca9ff33);color:white}
.footer{text-align:center;color:var(--muted);font-size:10px;margin-top:28px;letter-spacing:2px;direction:ltr}
.backdrop{position:fixed;inset:0;z-index:20;background:#020914dd;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:18px}
.backdrop.open{display:flex}
.drawer,.modal{width:min(100%,430px);max-height:88vh;overflow:auto;border:1px solid #789bc455;border-radius:25px;padding:20px;background:#091b30;color:#f4f8ff;box-shadow:0 20px 70px #0009}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.drawer h2,.modal h2{font-size:19px;margin:0}
.close{width:38px;height:38px;border:1px solid #789bc455;background:#ffffff10;color:white;border-radius:12px;font-size:21px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #789bc433;font-size:13px}
.setting-row small{display:block;color:#a9bfd8;font-size:11px;margin-top:5px;line-height:1.8}
.setting-action,.small-action{border:1px solid #7caaff66;background:#17365b;color:white;border-radius:12px;padding:10px 12px;white-space:nowrap}
.notice{border:1px solid #f5c36a66;background:#8b5b161f;border-radius:14px;padding:12px;color:#ffd99b;font-size:11px;line-height:1.9;margin:12px 0}
.modal p{font-size:12px;color:#c0d3e9;line-height:2}
.splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#123963aa,transparent 45%),linear-gradient(180deg,#031126f7,#020814 85%),url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=80') center/cover}
.splash-top{position:absolute;top:25px;left:22px;right:22px;display:flex;align-items:center;gap:12px;direction:ltr;font-size:12px;letter-spacing:3px}
.splash-crown{display:grid;place-items:center;width:42px;height:42px;border:1px solid #35cfff;border-radius:13px;color:#72dcff;font-size:23px}
.signature{font-family:"Brush Script MT","Segoe Script",cursive;font-style:italic;font-size:clamp(38px,10vw,58px);color:#36d9ff;text-shadow:0 0 25px #168dff99;direction:ltr;transform:rotate(-5deg);margin:8px 0}
.splash-sub{color:#36d9ff;font-size:11px;letter-spacing:4px;direction:ltr}
.splash-name{font-size:clamp(30px,8vw,48px);letter-spacing:1px;margin:0;color:#f5f9ff;direction:ltr}
.splash-name span{color:#70cfff}
.splash-tagline{color:#d4e7fb;font-size:12px;direction:ltr}
.splash-line{width:180px;height:1px;background:linear-gradient(90deg,transparent,#72dcff,transparent)}
.splash-enter{border:1px solid #26cfff;border-radius:999px;padding:14px 24px;color:#b8edff;background:#061a2ddd;letter-spacing:1px;font-size:12px;box-shadow:0 0 25px #168dff2b;direction:ltr}
.comment-form{display:grid;gap:8px;margin-top:12px}
.comment-form input,.comment-form textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;background:#081b30;color:#fff;font:inherit;outline:none}
.comment-form textarea{min-height:90px;resize:vertical}
.comment-card{border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0;background:#ffffff08}
.comment-card strong{font-size:13px}
.comment-card p{font-size:12px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}
.comment-meta{font-size:10px;color:var(--muted)}
.small-action{margin:5px 4px 0 0}
.auth-card{width:min(100%,430px);margin:20px auto;padding:22px;border:1px solid #72dcff55;border-radius:26px;background:linear-gradient(145deg,rgba(14,39,65,.96),rgba(2,9,20,.96));box-shadow:0 0 35px #168dff20;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.auth-card h2{text-align:center;color:#72dcff;margin:0 0 10px}
.auth-card p{text-align:center;color:#a9bfd8;font-size:12px;line-height:2}
.auth-card label{display:block;font-size:12px;margin-top:14px}
.auth-card input{display:block;width:100%;padding:14px;margin-top:8px;border:1px solid #72dcff44;border-radius:14px;background:#081b30;color:#fff;outline:none}
.auth-card .primary{width:100%;margin-top:12px}
.auth-message{font-size:12px;line-height:2;margin-top:12px;color:#72dcff;overflow-wrap:anywhere}
.auth-card [hidden]{display:none!important}
@media(max-width:380px){.social-grid{gap:5px}.social span:last-child{font-size:9px}.hero{padding-top:18px}}
</style>
</head>
